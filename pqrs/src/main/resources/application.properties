spring.application.name=pqrs

# MongoDB: local fallback for development; set MONGODB_URI in Render.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pqrs_db}

# Render injects PORT automatically.
server.port=${PORT:8080}
server.address=0.0.0.0

# Persistent file storage. On Render attach a disk at /var/data
# and set UPLOAD_DIR=/var/data/uploads.
app.upload-dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO

# Configure these as environment variables in Render.
jwt.secret=${JWT_SECRET}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
