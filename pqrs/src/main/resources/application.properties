spring.application.name=pqrs

# MongoDB: local fallback for development; set MONGODB_URI in Render.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pqrs_db}

# Render injects PORT automatically.
server.port=${PORT:8080}
server.address=0.0.0.0

# File storage: local filesystem by default; enable Cloudflare R2 with R2_ENABLED=true.
app.upload-dir=${UPLOAD_DIR:uploads}
app.r2.enabled=${R2_ENABLED:false}
app.r2.endpoint=${R2_ENDPOINT:}
app.r2.bucket=${R2_BUCKET_NAME:hoodvoice-adjuntos}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO

# Configure these as environment variables in Render.
jwt.secret=${JWT_SECRET}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
