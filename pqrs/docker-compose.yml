services:

  mongodb:
    image: mongo
    container_name: mongodb

    ports:
      - "27018:27017"

    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: springboot

    ports:
      - "8080:8080"

    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend

    container_name: reactapp

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  mongo_data: